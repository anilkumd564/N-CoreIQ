## N-CoreIQ — SAP BTP Multi-Target Application Deployment Descriptor
## Phase 9: Production-ready BTP deployment
##
## Modules:
##   ncoreiq-backend   — FastAPI application (Python)
##
## Resources (BTP Service instances):
##   ncoreiq-xsuaa       — SAP Authorization and Trust Management (XSUAA)
##   ncoreiq-destination — SAP Destination Service
##   ncoreiq-connectivity — SAP Connectivity Service
##
## Usage:
##   mbt build
##   cf deploy mta_archives/ncoreiq_1.0.0.mtar
##
## Prerequisites:
##   - SAP BTP Cloud Foundry space
##   - MBT (SAP Cloud MTA Build Tool): npm install -g mbt
##   - CF CLI with MTA plugin
##   - Destination 'NC1_ODATA' configured in BTP Destination service
##     (ProxyType=OnPremise, verified through SAP Cloud Connector)

_schema-version: "3.1"
ID: ncoreiq
description: "N-CoreIQ — SAP ECC Repository Intelligence Platform"
version: 1.0.0

parameters:
  enable-parallel-deployments: true
  keep-existing-routes: true
  ## ── Cross-application identity parameters ────────────────────────────────
  ## Foreign N-CoreShift xsappname — resolved at deployment time.
  ## Default assumes same-org/same-space co-deployment (same as ncoreshift mta.yaml).
  ## Override this parameter for cross-space deployment using a supported
  ## MTA extension/deployment parameter mechanism for the target environment.
  ncoreshift-xsappname: ncoreshift-${org}-${space}

modules:
  ## -----------------------------------------------------------------------
  ## N-CoreIQ Backend — FastAPI Python application
  ## -----------------------------------------------------------------------
  - name: ncoreiq-backend
    type: python
    path: ../..
    parameters:
      buildpack: python_buildpack
      memory: 768M
      disk-quota: 2G
      instances: 1
      health-check-type: http
      health-check-http-endpoint: /health/live
      health-check-timeout: 60
      routes:
        - route: ncoreiq.${default-domain}
    build-parameters:
      build-artifact-name: ncoreiq-backend
      requires-runtime: true
      ## ── Packaging exclusions ─────────────────────────────────────────────
      ## Patterns are relative to the module path (path: ../.. = project root).
      ## Excludes local-development artifacts, source-control metadata,
      ## knowledge-graph cache, local runtime databases, logs, test output,
      ## and non-backend project directories that are not required by the
      ## FastAPI Python runtime (uvicorn app.main:app).
      ## Runtime-required items intentionally NOT excluded:
      ##   app/  requirements.txt  Procfile  runtime.txt
      ignore:
        - ".git/"
        - ".graphify/"
        - ".venv/"
        - "__pycache__/"
        - ".pytest_cache/"
        - "coverage/"
        - "*.db"
        - "*.db-shm"
        - "*.db-wal"
        - "*.log"
        - "test_*.txt"
        - "*_test_out.txt"
        - "tests/"
        - "docs/"
        - "frontend/"
        - "approuter/"
        - "deployment/"
        - "scripts/"
        - "job_artifacts/"
        - "node_modules/"
        - "mta_archives/"
        - "*.mtar"
        - "*.vsix"
        - ".vscode/"
        - ".idea/"
        - "*.pyc"
        ## ── TLS / Certificate diagnostic artifacts ────────────────────────
        ## Root-level TLS inspection and debug files generated during
        ## BAS-based TLS diagnostics. DIAGNOSTIC ONLY — not runtime-required.
        ## Confirmed untracked/diagnostic via Gate B Step 4A review (2026-10-13).
        - "sap_ca.pem"
        - "sap_leaf.pem"
        - "sap_leaf_from_socket.pem"
        - "sap_leaf_cert.der"
        - "cert_analysis.txt"
        - "debug_tls_out.txt"
        - "diag_*.txt"
        - "tls_diag_result.txt"
        - "cert_info.txt"
        - "cert_info_result.txt"
        - "win_certs.txt"
    properties:
      APP_ENV: btp
      SAP_CONNECTION_MODE: btp
      ## Canonical BTP SAP destination name.
      ## ProxyType=OnPremise — routes through SAP Cloud Connector.
      ## Must match the verified destination in the BTP subaccount Destination service.
      SAP_DESTINATION_NAME: NC1_ODATA
      EXPORT_MODE: zip
      AUTH_MODE: xsuaa
      ## TEST/DEMO ONLY — anonymous MCP endpoint.
      ## Production deployments should use xsuaa.
      ## Only /mcp, /mcp/, and /mcp/* bypass XSUAA JWT authentication when
      ## set to "none". AUTH_MODE above continues to protect /api/v1/* and
      ## all other application routes unconditionally.
      NCOREIQ_MCP_AUTH_MODE: none
      LOG_LEVEL: INFO
      ## Logging format: json for BTP log aggregation, text for local dev
      LOGGING__FORMAT: json
      ## Concurrency limits — conservative defaults for BTP
      NCOREIQ_MAX_RUNNING_JOBS_PER_INSTANCE: 2
      NCOREIQ_MAX_SAP_CONCURRENCY_PER_INSTANCE: 5
      NCOREIQ_JOB_WORKERS: 2
      ## MCP transport — streamable_http for BTP remote MCP clients
      ## Canonical endpoint: POST https://<route>/mcp/
      NCOREIQ_MCP_TRANSPORT: streamable_http
      ## Artifact storage — use /tmp for BTP CF (ephemeral, see notes below)
      ## For production, configure object store via BTP Object Store service
      NCOREIQ_JOB_ARTIFACT_DIR: /tmp/ncoreiq_artifacts
      NCOREIQ_JOB_DB_PATH: /tmp/ncoreiq_jobs.db
    
    provides:
      - name: ncoreiq-backend-api
        properties:
          url: https://ncoreiq.${default-domain}

    requires:
      - name: ncoreiq-xsuaa
      - name: ncoreiq-destination
      - name: ncoreiq-connectivity

  ## -----------------------------------------------------------------------
  ## N-CoreIQ Application Router — authenticated browser entry point
  ## -----------------------------------------------------------------------
  - name: ncoreiq-approuter
    type: approuter.nodejs
    path: ../../approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      routes:
        - route: ncoreiq-ui.${default-domain}
    build-parameters:
      ## Custom build: installs AppRouter deps, builds the React/Vite SPA
      ## from ../frontend (relative to this module's own directory), and
      ## copies ONLY the production dist/ output into ./resources, which
      ## is then served by xs-app.json via "localDir": "resources".
      ## Deterministic — no runtime build occurs at CF startup.
      builder: custom
      commands:
        - npm ci
        - npm --prefix ../frontend ci
        - npm --prefix ../frontend run build
        - mkdir -p resources
        - cp -r ../frontend/dist/. resources/
      ## Exclude everything that must never reach the packaged AppRouter.
      ignore:
        - ".git/"
        - "*.log"
    requires:
      - name: ncoreiq-xsuaa
      - name: ncoreiq-backend-api
        group: destinations
        properties:
          name: ncoreiq-backend
          url: ~{url}
          forwardAuthToken: true

## -----------------------------------------------------------------------
## BTP Service Resources
## -----------------------------------------------------------------------

resources:
  ## XSUAA — Authorization and Trust Management Service
  - name: ncoreiq-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: ncoreiq-${org}-${space}
        tenant-mode: dedicated
        ## Cross-application scope grants — deployment-time substitution.
        ## MTA replaces the top-level "scopes" key; the xs-security.json scopes
        ## (without grant-as-authority-to-apps) are superseded by this array.
        ## ${ncoreshift-xsappname} resolves to the effective N-CoreShift xsappname
        ## (default: ncoreshift-${org}-${space}; overridable for cross-space).
        ## Operator and Admin do NOT grant authority to N-CoreShift (least privilege).
        scopes:
          - name: "$XSAPPNAME.NCoreIQ.Viewer"
            description: "Read-only access: SAP connectivity status, package browsing, repository search, metadata, source, dependencies"
            grant-as-authority-to-apps:
              - "$XSAPPNAME(application,${ncoreshift-xsappname})"
          - name: "$XSAPPNAME.NCoreIQ.Analyst"
            description: "Analyst access: all Viewer capabilities plus dependency traversal, reverse analysis, impact analysis, source export, job management"
            grant-as-authority-to-apps:
              - "$XSAPPNAME(application,${ncoreshift-xsappname})"
          - name: "$XSAPPNAME.NCoreIQ.Operator"
            description: "Operator access: all Analyst capabilities plus job management, artifact operations, job cancellation and retry"
          - name: "$XSAPPNAME.NCoreIQ.Admin"
            description: "Admin access: all Operator capabilities plus diagnostics, configuration visibility, administrative operations"

  ## Destination Service
  - name: ncoreiq-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ecc-mcp-destination


  ## Connectivity Service (required for Cloud Connector / on-premise ECC)
  - name: ncoreiq-connectivity
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ecc-mcp-connectivity
