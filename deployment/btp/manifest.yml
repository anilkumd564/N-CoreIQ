---
applications:
  - name: sap-repository-intelligence
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    env:
      APP_ENV: btp
      SAP_CONNECTION_MODE: btp
      # Canonical BTP SAP destination name. Must match the verified destination
      # in the BTP subaccount Destination service (ProxyType=OnPremise via Cloud Connector).
      SAP_DESTINATION_NAME: NC1_ODATA
      EXPORT_MODE: zip
      AUTH_MODE: xsuaa
      NCOREIQ_MCP_TRANSPORT: streamable_http
    services:
      - sri-destination
      - sri-connectivity
      - sri-xsuaa
